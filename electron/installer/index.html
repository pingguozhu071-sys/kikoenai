<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>安装 Kikoenai</title>
  <style>
    :root {
      --bg: #141218;
      --surface: #1d1b20;
      --surface-high: #2b2930;
      --surface-higher: #36343b;
      --primary: #cfbcff;
      --on-primary: #381e72;
      --primary-container: #4f378b;
      --text: #e6e0e9;
      --muted: #cac4d0;
      --outline: #49454f;
      --error: #ffb4ab;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, 'Microsoft YaHei UI', sans-serif;
      display: flex; flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 自绘标题栏 */
    .titlebar {
      height: 40px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 6px 0 16px;
      -webkit-app-region: drag;
    }
    .titlebar .name { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
    .titlebar .spacer { flex: 1; }
    .tbtn {
      width: 40px; height: 32px; border: none; background: transparent; color: var(--muted);
      display: grid; place-items: center; cursor: pointer; border-radius: 8px;
      -webkit-app-region: no-drag;
    }
    .tbtn:hover { background: var(--surface-high); color: var(--text); }

    .body {
      flex: 1; min-height: 0;
      display: grid; place-items: center;
      padding: 8px 40px 36px;
    }
    .card {
      width: 100%; max-width: 620px;
      background: var(--surface);
      border-radius: 24px;
      padding: 30px 32px 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .logo {
      width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
      background: linear-gradient(145deg, var(--primary-container), #7a5fb8);
      display: grid; place-items: center;
      font-size: 26px; font-weight: 700; color: #fff;
    }
    h1 { font-size: 21px; margin: 0 0 4px; font-weight: 650; }
    .sub { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

    .field { margin-top: 18px; }
    .field-label { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
    .dir-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0; height: 42px;
      border-radius: 12px; border: 1px solid var(--outline);
      background: var(--surface-high); color: var(--text);
      padding: 0 14px; font-family: inherit; font-size: 13px; outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn {
      height: 40px; padding: 0 20px; border: none; border-radius: 20px;
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .btn.primary:not(:disabled):hover { filter: brightness(1.06); }
    .btn.ghost { background: var(--surface-high); color: var(--text); }
    .btn.ghost:hover { background: var(--surface-higher); }

    .check { display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: var(--primary); }

    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
    .hint { font-size: 11.5px; color: var(--muted); line-height: 1.65; margin-top: 10px; }
    .hint.error { color: var(--error); }

    /* 进度 */
    .bar {
      height: 8px; border-radius: 4px; background: var(--surface-high);
      overflow: hidden; margin-top: 6px;
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--primary), #a68ae8);
      transition: width 0.18s linear;
    }
    .pct-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 10px; }
    .file { font-size: 11.5px; color: var(--muted); margin-top: 6px; height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .done-mark {
      width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center; margin-bottom: 4px;
      background: var(--primary-container); color: #fff; font-size: 26px;
    }

    .step { display: none; }
    .step.on { display: block; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="name">Kikoenai 安装程序</span>
    <span class="spacer"></span>
    <button class="tbtn" id="min" title="最小化">—</button>
    <button class="tbtn" id="close" title="关闭">✕</button>
  </div>

  <div class="body">
    <div class="card">
      <!-- 1. 欢迎 / 选择目录 -->
      <section class="step on" id="step-welcome">
        <div class="hero">
          <div class="logo">K</div>
          <div>
            <h1>安装 Kikoenai</h1>
            <div class="sub" id="ver">ASMR 桌面客户端</div>
          </div>
        </div>

        <div class="field">
          <div class="field-label">安装位置</div>
          <div class="dir-row">
            <input type="text" id="dir" spellcheck="false" />
            <button class="btn ghost" id="pick">浏览…</button>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" id="desktop" checked />
          在桌面创建快捷方式
        </label>

        <div class="hint" id="welcome-hint">
          会同时创建开始菜单快捷方式，并登记到「应用和功能」里方便卸载。<br />
          已下载的作品、账号与设置保存在用户目录，卸载时不会删除。
        </div>

        <div class="actions">
          <button class="btn primary" id="install">安装</button>
        </div>
      </section>

      <!-- 2. 进度 -->
      <section class="step" id="step-progress">
        <div class="hero">
          <div class="logo">K</div>
          <div>
            <h1>正在安装</h1>
            <div class="sub">复制文件并创建快捷方式…</div>
          </div>
        </div>

        <div class="bar"><i id="bar-fill"></i></div>
        <div class="pct-row"><span id="pct">0%</span><span id="count">0 / 0</span></div>
        <div class="file" id="file"></div>

        <div class="hint error" id="progress-error" style="display: none"></div>
        <div class="actions" id="progress-actions" style="display: none">
          <button class="btn ghost" id="retry">返回重试</button>
        </div>
      </section>

      <!-- 3. 完成 -->
      <section class="step" id="step-done">
        <div class="hero">
          <div class="done-mark">✓</div>
          <div>
            <h1>安装完成</h1>
            <div class="sub" id="done-path">Kikoenai 已安装到本机</div>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" id="launch" checked />
          立即启动 Kikoenai
        </label>

        <div class="actions">
          <button class="btn primary" id="finish">完成</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    const dirInput = $('dir')
    let info = { version: '', defaultDir: '' }
    let installedDir = ''
    let busy = false

    function show(step) {
      for (const el of document.querySelectorAll('.step')) el.classList.remove('on')
      $(`step-${step}`).classList.add('on')
    }

    $('min').onclick = () => window.setup.minimize()
    $('close').onclick = () => {
      if (busy) return
      window.setup.close()
    }

    ;(async () => {
      info = await window.setup.info()
      $('ver').textContent = `版本 ${info.version} · ASMR 桌面客户端`
      dirInput.value = info.defaultDir
    })()

    $('pick').onclick = async () => {
      const dir = await window.setup.pickDir()
      if (dir) dirInput.value = dir
    }

    window.setup.onProgress(({ done, total, name }) => {
      const pct = total ? Math.round((done / total) * 100) : 0
      $('bar-fill').style.width = pct + '%'
      $('pct').textContent = pct + '%'
      $('count').textContent = `${done} / ${total}`
      $('file').textContent = name || ''
    })

    $('install').onclick = async () => {
      if (busy) return
      const dir = dirInput.value.trim()
      if (!dir) {
        $('welcome-hint').classList.add('error')
        $('welcome-hint').textContent = '请先选择安装位置'
        return
      }

      busy = true
      show('progress')
      $('progress-error').style.display = 'none'
      $('progress-actions').style.display = 'none'

      const res = await window.setup.install({ dir, desktopShortcut: $('desktop').checked })

      if (!res || !res.ok) {
        busy = false
        $('progress-error').style.display = 'block'
        $('progress-error').textContent = (res && res.error) || '安装失败'
        // 复用同一个按钮，避免重复失败时按钮越堆越多
        $('progress-actions').style.display = 'flex'
        return
      }

      installedDir = res.target
      busy = false
      $('done-path').textContent = `已安装到 ${res.target}（共 ${res.files} 个文件）`
      show('done')
    }

    $('retry').onclick = () => {
      if (busy) return
      busy = false
      $('progress-error').style.display = 'none'
      $('progress-actions').style.display = 'none'
      $('bar-fill').style.width = '0%'
      $('pct').textContent = '0%'
      $('count').textContent = '0 / 0'
      $('file').textContent = ''
      show('welcome')
    }

    $('finish').onclick = async () => {
      await window.setup.finish({ launch: $('launch').checked, dir: installedDir })
    }
  </script>
</body>
</html>
